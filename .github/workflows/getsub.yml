name: Fetch and Split Subscriptions

on:
  push:
    branches: [ main ]
  # schedule:
  #   - cron: '0 3 * * *'

jobs:
  fetch:
    runs-on: ubuntu-24.04          # 固定版本，避免自动切到 Ubuntu 26
    steps:
      - name: Checkout code
        uses: actions/checkout@v5   # 升级到 v5，支持 Node 24

      - name: Set up Python
        uses: actions/setup-python@v6  # 升级到 v6，支持 Node 24
        with:
          python-version: '3.12'      # 建议顺便升到 3.12

      - name: Install dependencies
        run: pip install aiohttp requests

      - name: Run fetch script
        run: python fetch_subscriptions.py

      - name: Commit and push files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add subscriptions_*.txt
          git add SUBSCRIPTIONS_INFO.md
          
          if [ -f "merged_subscriptions.txt" ]; then
            git rm merged_subscriptions.txt
          fi
          
          git diff --cached --quiet || git commit -m "更新订阅文件"
          git push origin main
