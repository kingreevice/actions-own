name: Fetch and Split Subscriptions

on:
  push:
    branches: [ main ]
  # schedule:
  #   - cron: '0 3 * * *'   # 需要定时的话取消注释

jobs:
  fetch:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install aiohttp requests

      - name: Run fetch script
        run: python fetch_subscriptions.py

      - name: Commit and push files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 先拉取远程最新代码，避免推送冲突
          git pull --rebase origin main || git pull origin main --no-rebase
          
          # 添加需要提交的文件（根据你实际生成的文件调整）
          git add subscriptions_*.txt || true
          git add SUBSCRIPTIONS_INFO.md || true
          git add ss.txt || true
          git add output/ || true
          
          # 清理旧文件（如果有）
          if [ -f "merged_subscriptions.txt" ]; then
            git rm merged_subscriptions.txt || true
          fi
          
          # 有变化才提交并推送
          if ! git diff --cached --quiet; then
            git commit -m "更新订阅文件 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main
          else
            echo "没有文件变化，跳过提交"
          fi
