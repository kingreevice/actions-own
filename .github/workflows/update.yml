name: Update Free Subs

on:
  schedule:
    - cron: "0 */12 * * *"   # 每 6 小时执行一次
  workflow_dispatch:         # 允许手动触发

jobs:
  merge:
    runs-on: ubuntu-24.04   # 先固定用 24.04，避免直接跳到 26 出问题
    # 或者继续用 ubuntu-latest（到时候会自动变成 26）

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5   # 升级到 v5（已支持 Node 24）

      - name: Set up Python
        uses: actions/setup-python@v6  # 升级到 v6（已支持 Node 24）
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run merge script
        run: python merge.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto update subscriptions $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          )
